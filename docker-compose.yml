services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clinica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clinica}
      POSTGRES_DB: ${POSTGRES_DB:-sistema_clinica}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  bot:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    restart: unless-stopped
    depends_on:
      - postgres
    env_file: .env
    ports:
      - "3001:3001"

  panel:
    build:
      context: .
      dockerfile: apps/panel/Dockerfile
    restart: unless-stopped
    depends_on:
      - postgres
    env_file: .env
    ports:
      - "3000:3000"

volumes:
  postgres_data:
